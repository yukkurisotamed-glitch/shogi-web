<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess-Style Shogi — Free Browser Game</title>
  <meta name="description" content="Play chess-style shogi for free. Chess piece shapes meet Japanese rules. 8 languages, 12 difficulty levels. No kanji needed." />
  <meta property="og:title" content="Chess-Style Shogi — Free Browser Game" />
  <meta property="og:description" content="Chess silhouettes meet Japanese strategy. Play shogi in your browser — no kanji needed." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://shogi-web-b40f4.web.app" />
  <meta property="og:image" content="https://shogi-web-b40f4.web.app/pieces/normal/%E7%99%BD%E3%82%AD%E3%83%B3%E3%82%B0.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Chess-Style Shogi — Free Browser Game" />
  <meta name="twitter:description" content="Chess silhouettes meet Japanese strategy. Play shogi free — no kanji needed." />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1 data-i18n="title">将棋 CPU 対戦</h1>
      <div id="status-bar">
        <span id="turn-label" data-i18n="yourTurn">あなたの番（先手）</span>
        <label style="font-size:13px;color:#ccc;">
          <span data-i18n="strength">強さ</span>:
          <select id="sel-level">
            <option value="d1"  data-level="beginner" data-num="1">入門 1</option>
            <option value="d2"  data-level="beginner" data-num="2">入門 2</option>
            <option value="d3"  data-level="beginner" data-num="3">入門 3</option>
            <option value="d4"  data-level="easy"     data-num="1">初級 1</option>
            <option value="d5"  data-level="easy"     data-num="2">初級 2</option>
            <option value="d6"  data-level="easy"     data-num="3">初級 3</option>
            <option value="d7"  data-level="medium"   data-num="1" selected>中級 1</option>
            <option value="d8"  data-level="medium"   data-num="2">中級 2</option>
            <option value="d9"  data-level="medium"   data-num="3">中級 3</option>
            <option value="d10" data-level="hard"     data-num="1">上級 1</option>
            <option value="d12" data-level="hard"     data-num="2">上級 2</option>
            <option value="d15" data-level="hard"     data-num="3">上級 3</option>
          </select>
        </label>
        <button id="btn-undo" data-i18n="undo">待った</button>
        <button id="btn-reset" data-i18n="reset">最初から</button>
        <button id="btn-howto">遊び方</button>
        <button id="btn-ref-toggle">駒の動きを常に表示</button>
        <select id="sel-lang" title="Language">
          <option value="ja">🇯🇵 日本語</option>
          <option value="en">🇺🇸 English</option>
          <option value="zh">🇨🇳 中文</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="es">🇪🇸 Español</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="it">🇮🇹 Italiano</option>
          <option value="de">🇩🇪 Deutsch</option>
        </select>
      </div>
    </header>

    <main>
      <div id="ref-panel" class="hidden">
        <img src="/setumei3.png" alt="駒の動き" id="ref-img" />
      </div>
      <div id="game-content">
      <div id="hand-gote" class="hand-area">
        <span class="hand-label" data-i18n="cpuHand">CPU 持ち駒</span>
        <div class="hand-pieces" id="hand-gote-pieces"></div>
      </div>

      <div id="board-outer">
        <div class="col-labels">
          <span>9</span><span>8</span><span>7</span><span>6</span><span>5</span>
          <span>4</span><span>3</span><span>2</span><span>1</span>
        </div>
        <div class="board-row">
          <div id="board"></div>
          <div class="row-labels">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span>
            <span>六</span><span>七</span><span>八</span><span>九</span>
          </div>
        </div>
      </div>

      <div id="hand-sente" class="hand-area">
        <span class="hand-label" data-i18n="yourHand">あなた 持ち駒</span>
        <div class="hand-pieces" id="hand-sente-pieces"></div>
      </div>
      </div> <!-- /#game-content -->
    </main>

    <!-- Product section -->
    <section id="product-banner">
      <div id="product-badge">🎲 手作り — Handcrafted Set</div>
      <div id="product-content">
        <div id="product-img-wrap">
          <img src="/pieces/normal/白キング.png" alt="Chess-Shogi piece" id="product-img" />
        </div>
        <div id="product-text">
          <h2 data-i18n="productHeading">物理セットで遊ぼう</h2>
          <p data-i18n="productDesc">チェス駒シルエット × 和の装束。本物の駒で対局するならこちら。</p>
          <a id="product-link" href="https://www.etsy.com/listing/4514605767?utm_source=shogi_web&utm_medium=footer&utm_campaign=product_banner" target="_blank" rel="noopener">
            <span data-i18n="productBtn">Etsy で見る</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
      </div>
      <p id="product-credit">Powered by <a href="https://github.com/mizar/YaneuraOu.wasm" target="_blank" rel="noopener">YaneuraOu</a> (GPL-3.0)</p>
    </section>

    <!-- How-to modal -->
    <div id="howto-modal" class="hidden">
      <div id="howto-inner">
        <button id="btn-howto-close">✕</button>
        <div id="howto-slides">
          <img src="/setumei1.png" alt="遊び方 1" class="howto-img active" data-index="0" />
          <img src="/setumei2.png" alt="遊び方 2" class="howto-img"        data-index="1" />
          <img src="/setumei3.png" alt="遊び方 3" class="howto-img"        data-index="2" />
        </div>
        <div id="howto-nav">
          <button id="btn-howto-prev">‹</button>
          <span id="howto-page">1 / 3</span>
          <button id="btn-howto-next">›</button>
        </div>
      </div>
    </div>

    <div id="promote-dialog" class="dialog hidden">
      <p data-i18n="promoteQ">成りますか？</p>
      <button id="btn-promote-yes" data-i18n="promoteYes">成る</button>
      <button id="btn-promote-no"  data-i18n="promoteNo">成らない</button>
    </div>
    <div id="overlay" class="hidden"></div>

    <div id="end-dialog" class="dialog hidden">
      <p id="end-message"></p>
      <div id="end-etsy-cta">
        <img src="/pieces/normal/白キング.png" alt="" />
        <p data-i18n="productHeading">物理セットで遊ぼう</p>
        <a href="https://www.etsy.com/listing/4514605767?utm_source=shogi_web&utm_medium=game_end&utm_campaign=win_cta" target="_blank" rel="noopener" data-i18n="productBtn">Etsy で見る</a>
      </div>
      <button id="btn-end-ok" data-i18n="playAgain">もう一度</button>
    </div>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="piece-outline" x="-10%" y="-10%" width="120%" height="120%">
        <feMorphology operator="dilate" radius="1.2" in="SourceAlpha" result="expanded"/>
        <feFlood flood-color="#333" result="color"/>
        <feComposite in="color" in2="expanded" operator="in" result="outline"/>
        <feMerge>
          <feMergeNode in="outline"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
  </svg>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
